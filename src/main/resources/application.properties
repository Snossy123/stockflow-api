spring.application.name=arafawood-api
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arafawood}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:arafa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:arafa}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Cairo
spring.flyway.enabled=true

server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
